<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>Weather App Coded By Caroline Schor</title>
  </head>
  <body class="cloudy">
    <div class="weather-app-container">
      <div class="weather">
    <header>
        <a href="https://www.shecodes.io/" target="blank"> <img class="logo" alt="SheCodes Logo" src="source/logo.png"></a>
      <form>
        <input
          type="search"
          name=""
          id="city"
          placeholder="Enter a city..."
          required
        />
        <input type="submit" value="Search" />
      </form>
    </header>
    <main>
        <div class="current-weather">
        <div class="weather-data-left">
        <h1>London</h1>
        <p>
          Friday 09:45 overcast clouds
          <br />
          Humidty:66%, Wind: 3.13km/h
        </p>
      </div>
    <div class="weather-temp-right">⛅ 12°C</div>
    </div>
    </main>
    <footer>
      Coded by
      <a href="https://github.com/carolinescgit/vanilla-wetter-app"
        >Caroline Schor</a
      >
      and hosted on
      <a href="https://deft-rugelach-d47053.netlify.app/">Netlify</a>
    </footer>
</div>
  </body>
</html>
