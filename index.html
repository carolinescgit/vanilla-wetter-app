<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <title>Weather App Coded By Caroline Schor</title>
  </head>
  <body class="cloudy">
    <div class="weather-app-container">
      <div class="weather">
    <header>
        <a href="https://www.shecodes.io/" target="blank"> <img class="logo" alt="SheCodes Logo" src="src/logo.png"></a>
      <form id="search-form">
        <input
          type="search"
          name=""
          id="city"
          placeholder="Enter a city..."
          required
        />
        <input type="submit" value="Search" />
      </form>
    </header>
    <main>
        <div class="current-weather">
        <div class="weather-data-left">
        <h1 id="city-heading"></h1>
        <p>
          <span id="time"></span>, <span id="description"></span>
          <br />
          Humidty: <strong id="humidity"></strong>, Wind: <strong id="wind"></strong>
        </p>
      </div>
    <div class="weather-temp-right">
        <div class="temp-right-icon">⛅</div>
        <div class="temp-right" id="temperature"></div>
        <div class="temp-right-unit">°C</div>
    </div>
    </main>
    <footer>
      This project was coded by
      <a href="https://github.com/carolinescgit/vanilla-wetter-app"
        >Caroline Schor</a
      >
      and is hosted on
      <a href="https://deft-rugelach-d47053.netlify.app/">Netlify.</a>
    </footer>
</div>
<script src="src/index.js"></script>
  </body>
</html>
